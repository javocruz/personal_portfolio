    <script>
      // Before anything else: set the mode and Core's style (so colours are right on the first paint) and, for
      // Complete's home, start downloading the hero image while the JavaScript loads.
      try {
        var q = new URLSearchParams(location.search)
        var m = q.get('mode') || localStorage.getItem('mode')
        var s = q.get('style') || localStorage.getItem('coreStyle')
        document.documentElement.dataset.mode = m === 'core' || m === 'complete' ? m : 'gate'
        document.documentElement.dataset.coreStyle = s === 'mondrian' ? s : 'rothko'
        localStorage.removeItem('theme') // the light/dark switch is gone: each mode has one fixed base
        if (m === 'complete' && location.pathname === '/') {
          var l = document.createElement('link')
          l.rel = 'preload'; l.as = 'image'; l.setAttribute('fetchpriority', 'high')
          l.setAttribute('imagesrcset', '/art/isle-dusk-960.jpg 960w, /art/isle-dusk-1920.jpg 1920w'); l.setAttribute('imagesizes', '100vw')
          document.head.appendChild(l)
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking the first paint -->
